<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />

  <!-- SEO -->

  <!-- Open Graph -->
  <meta property="og:type" content="website" />

  <meta property="og:title" content="Linkovia Network | Comprendre le terrain, créer des liens" />

  <meta property="og:image" content="https://linkovia-network.org/og-cover.jpg" />
  <meta property="og:locale" content="fr_FR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Linkovia Network | Comprendre le terrain, créer des liens" />
  <meta name="twitter:description" content="Linkovia Network donne de la visibilité aux initiatives locales de développement et les met en relation avec les partenaires et financeurs internationaux." />
  <meta name="twitter:image" content="https://linkovia-network.org/og-cover.jpg" />

  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bleu:        #C06800;
      --bleu-clair:  #E08820;
      --vert:        #1E9660;
      --vert-clair:  #28A870;
      --terre:       #D4820A;
      --beige:       #F5F0E8;
      --beige-fort:  #EDE7D9;
      --gris:        #5A6A5E;
      --gris-clair:  #FAF6EE;
      --blanc:       #FFFFFF;
      --sombre:      #0D3A1E;
      --surface:     rgba(255,255,255,0.84);
      --surface-soft:rgba(255,255,255,0.68);
      --line-soft:   rgba(13,58,30,0.09);
      --shadow-soft: 0 10px 24px rgba(13,58,30,0.07);
      --shadow-lift: 0 16px 34px rgba(13,58,30,0.11);
      --radius-sm:   8px;
      --radius-md:   14px;
      --radius-lg:   18px;
      --radius-xl:   24px;
      --text-soft:   rgba(13,58,30,0.74);
      --text-muted:  rgba(13,58,30,0.58);
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
      color: var(--sombre);
      scroll-behavior: smooth;
      line-height: 1.6;
      letter-spacing: -0.01em;
    }

    p, .lead, .domaine-ex, .carte-role p, .pilier p,
    .contact-intro p, .domaines-conclusion p, .panel-field p,
    .flux-bloc li, .enjeu-constat p {
      text-align: justify;
      hyphens: auto;
    }

    /* ── NAVIGATION ── */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(12, 74, 53, 0.97);
      backdrop-filter: blur(8px);
      z-index: 100;
      padding: 0.9rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }

    .logo img {
      height: 38px;
      width: auto;
      display: block;
      border-radius: var(--radius-sm);
    }

    .logo-name {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }
    .logo-sub {
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: uppercase;
      opacity: 0.72;
      text-align: justify;
      text-align-last: justify;
      text-justify: inter-character;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.2rem;
    }

    .nav-links a {
      color: rgba(255,255,255,0.80);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: #fff; }

    .nav-cta {
      background: var(--terre);
      color: #fff !important;
      padding: 0.45rem 1.1rem;
      border-radius: var(--radius-sm);
      font-weight: 600 !important;
    }

    .nav-cta:hover { opacity: 0.88; }

    /* ── LANGUAGE SWITCHER ── */
    .lang-switcher {
      display: flex;
      gap: 0.3rem;
    }

    .lang-switcher button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.35);
      color: rgba(255,255,255,0.65);
      padding: 0.28rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .lang-switcher button:hover {
      border-color: rgba(255,255,255,0.7);
      color: #fff;
    }

    .lang-switcher button.active {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.6);
      color: #fff;
    }

    /* ── HAMBURGER ── */
    .hamburger {
      display: none;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.2rem 0.3rem;
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      background: rgba(12, 74, 53, 0.97);
      backdrop-filter: blur(8px);
      z-index: 99;
      padding: 0.5rem 1.5rem 1rem;
    }

    .mobile-menu ul {
      list-style: none;
    }

    .mobile-menu ul li a {
      display: block;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      transition: color 0.2s;
    }

    .mobile-menu ul li:last-child a {
      border-bottom: none;
    }

    .mobile-menu ul li a:hover { color: #fff; }

    .mobile-menu ul li a.nav-cta {
      display: inline-block;
      margin-top: 0.6rem;
      border-bottom: none;
      background: var(--terre);
      color: #fff;
      padding: 0.55rem 1.3rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }

    .mobile-menu.open { display: block; }

    /* ── HERO ── */
    #accueil {
      min-height: 100vh;
      background:
        linear-gradient(160deg, rgba(12,74,53,0.78) 0%, rgba(7,43,31,0.88) 100%),
        url('images/hero-background.jpg') center / cover no-repeat;
      display: flex;
      align-items: center;
      padding: 8rem 2.5rem 5rem;
      position: relative;
      overflow: hidden;
    }

    #accueil::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 80% 30%, rgba(192,104,0,0.15) 0%, transparent 55%);
    }

    .hero-inner {
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero-surtitre {
      display: inline-block;
      background: rgba(192,104,0,0.12);
      color: var(--bleu);
      border: 1px solid rgba(192,104,0,0.35);
      padding: 0.35rem 1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
    }

    .hero-inner h1 {
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
      max-width: 720px;
      margin-bottom: 1.5rem;
    }

    .hero-inner h1 em {
      font-style: normal;
      color: var(--bleu);
    }

    [lang="en"] .hero-inner h1 {
      font-size: clamp(1.8rem, 3.5vw, 3rem);
    }

    .hero-inner p {
      font-size: 1.08rem;
      color: rgba(255,255,255,0.84);
      max-width: 610px;
      margin-bottom: 2.5rem;
      line-height: 1.82;
    }

    .hero-btns { display: flex; gap: 1rem; flex-wrap: wrap; }

    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-principal { background: var(--bleu); color: #fff; }
    .btn-principal:hover { background: #A05600; }

    .btn-contour {
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.55);
    }

    .btn-contour:hover {
      border-color: #fff;
      background: rgba(255,255,255,0.10);
    }

    /* ── PHASE BANNER ── */
    .phase-banner {
      position: sticky;
      top: calc(38px + 1.8rem);
      left: 0;
      right: 0;
      background: rgba(7, 43, 31, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      padding: 0.85rem 2.5rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.55;
      z-index: 99;
    }

    .phase-banner-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--vert-clair);
      flex-shrink: 0;
      opacity: 0.85;
    }

    .phase-banner p { margin: 0; }

    .phase-banner strong {
      color: rgba(255, 255, 255, 0.88);
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .phase-banner {
        top: calc(38px + 1.6rem);
        padding: 0.75rem 1.25rem;
        font-size: 0.78rem;
        gap: 0.65rem;
      }
    }

    @media (max-width: 900px) {
      .phase-banner {
        position: fixed;
        top: auto;
        bottom: 0;
        padding: 0.35rem 1.25rem;
        font-size: 0.72rem;
        background: rgba(7, 43, 31, 0.45);
        backdrop-filter: blur(4px);
        color: rgba(255,255,255,0.40);
        gap: 0.5rem;
      }
      .phase-banner-dot { opacity: 0.4; width: 5px; height: 5px; }
      .phase-banner strong { color: rgba(255,255,255,0.50); }
    }

    /* ── SECTIONS COMMUNES ── */
    section { padding: 5.5rem 2.5rem; }

    .container { max-width: 1100px; margin: 0 auto; }

    .section-en-tete { margin-bottom: 3.5rem; }
    .section-en-tete.centre {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
    }
    .section-en-tete.centre p.lead { margin-left: auto; margin-right: auto; }

    .tag {
      display: inline-block;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1rem;
    }

    .tag-vert  { background: rgba(30,150,96,0.13); color: var(--vert); border: 1px solid rgba(30,150,96,0.18); }
    .tag-bleu  { background: rgba(192,104,0,0.13); color: var(--bleu); border: 1px solid rgba(192,104,0,0.18); }
    .tag-terre { background: rgba(212,130,10,0.14); color: var(--terre); border: 1px solid rgba(212,130,10,0.18); }
    .tag-gris  { background: rgba(30,150,96,0.10); color: var(--vert); border: 1px solid rgba(30,150,96,0.16); }

    .section-en-tete h2 {
      font-size: clamp(1.8rem, 3.5vw, 2.55rem);
      font-weight: 800;
      color: var(--bleu);
      line-height: 1.2;
      letter-spacing: -0.03em;
      margin-bottom: 0.9rem;
    }

    .section-en-tete p.lead {
      font-size: 1.06rem;
      color: var(--text-soft);
      line-height: 1.85;
    }

    .section-en-tete.section-parent h2 {
      font-size: clamp(1.95rem, 3.8vw, 2.8rem);
      margin-bottom: 1rem;
    }
    .demarche-partie {
      margin-top: 3.2rem;
      margin-bottom: 1.5rem;
    }
    .demarche-partie h3 {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--vert);
      margin-bottom: 0.72rem;
    }
    .demarche-partie h4 {
      font-size: clamp(1.5rem, 2.8vw, 2rem);
      font-weight: 760;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--bleu);
      margin-bottom: 0.82rem;
    }
    .demarche-partie p.lead {
      font-size: 1rem;
      color: var(--text-soft);
      line-height: 1.82;
    }
    #notre-approche .demarche-partie { margin-top: 0; }
    .principes-partie {
      margin-top: 0;
      margin-bottom: 0.9rem;
    }

    /* ── NOTRE RÔLE ── */
    #notre-role { background: var(--beige); }
    #notre-role .section-en-tete { margin-bottom: 1.5rem; }

    .role-grille {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 2rem;
    }

    .carte-role {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 2rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--line-soft);
      border-left: 4px solid;
      transition: transform 0.24s ease, box-shadow 0.24s ease;
    }
    .carte-role:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lift);
    }

    .carte-role:nth-child(1) { border-color: var(--vert); }
    .carte-role:nth-child(2) { border-color: var(--terre); }
    .carte-role:nth-child(3) { border-color: var(--bleu); }

    .carte-role .icone { font-size: 2rem; margin-bottom: 1rem; }

    .carte-role h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--bleu);
      margin-bottom: 0.6rem;
    }

    .carte-role p { font-size: 0.95rem; color: var(--text-soft); line-height: 1.78; }

    /* ── NOTRE APPROCHE ── */
    #notre-approche {
      background: var(--blanc);
      position: relative;
    }
    #notre-approche::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(13,58,30,0.038) 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      pointer-events: none;
    }
    #notre-approche .container { position: relative; }

    /* ── MÉTHODE 6 ÉTAPES ── */
    .methode-phase { margin-bottom: 0; }

    .methode-phase-label {
      text-align: center;
      margin-bottom: 1.6rem;
    }

    .phase-badge {
      display: inline-block;
      padding: 0.4rem 1.5rem;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(192,104,0,0.09);
      color: var(--bleu);
      border: 1px solid rgba(192,104,0,0.22);
    }
    .phase-badge-2 {
      background: rgba(30,150,96,0.08);
      color: var(--vert);
      border-color: rgba(30,150,96,0.2);
    }

    .methode-grille {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .etapes-encadre {
      background: linear-gradient(160deg, var(--beige-fort) 0%, var(--beige) 55%);
      border: 1px solid rgba(13,58,30,0.10);
      border-radius: var(--radius-xl);
      padding: 2.25rem 2rem 2.25rem;
      margin-top: 0.5rem;
      margin-bottom: 4.2rem;
      box-shadow: 0 4px 24px rgba(13,58,30,0.06);
    }

    .etapes-encadre-titre {
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--bleu);
      margin: 0 0 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid rgba(13,58,30,0.10);
    }

    .methode-etape {
      border-radius: var(--radius-md);
      padding: 1.75rem 1.5rem 1.5rem;
      border: 1px solid rgba(13,58,30,0.07);
      box-shadow: 0 2px 14px rgba(13,58,30,0.05);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .methode-etape::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent, var(--bleu));
      border-radius: 14px 14px 0 0;
    }
    /* Phase 1 — dégradé coin haut-gauche → blanc */
    .methode-etape[data-step="1"] { --accent: var(--bleu);  background: linear-gradient(135deg, rgba(192,104,0,0.14) 0%, #ffffff 68%); }
    .methode-etape[data-step="2"] { --accent: var(--terre); background: linear-gradient(135deg, rgba(212,130,10,0.14) 0%, #ffffff 68%); }
    .methode-etape[data-step="3"] { --accent: var(--vert);  background: linear-gradient(135deg, rgba(30,150,96,0.13) 0%, #ffffff 68%); }
    /* Phase 2 — dégradé coin bas-droit → blanc */
    .methode-etape[data-step="4"] { --accent: var(--bleu);  background: linear-gradient(315deg, rgba(192,104,0,0.14) 0%, #ffffff 68%); }
    .methode-etape[data-step="5"] { --accent: var(--terre); background: linear-gradient(315deg, rgba(212,130,10,0.14) 0%, #ffffff 68%); }
    .methode-etape[data-step="6"] { --accent: var(--vert);  background: linear-gradient(315deg, rgba(30,150,96,0.13) 0%, #ffffff 68%); }

    @media (hover: hover) {
      .methode-etape:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 32px rgba(13,58,30,0.1);
      }
    }

    .etape-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .etape-num {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent, var(--bleu));
    }

    .etape-icone { font-size: 1.7rem; line-height: 1; }

    .methode-etape h3 {
      font-size: 0.97rem;
      font-weight: 700;
      color: var(--sombre);
      line-height: 1.35;
      margin: 0;
    }

    .methode-etape > p {
      font-size: 0.87rem;
      color: var(--gris);
      line-height: 1.65;
      margin: 0;
      text-align: left;
    }

    .etape-details {
      list-style: none;
      padding: 0.75rem 0 0;
      margin: 0.25rem 0 0;
      border-top: 1px solid rgba(13,58,30,0.09);
      display: none;
      flex-direction: column;
      gap: 0.4rem;
    }
    .etape-details.open { display: flex; }

    .etape-toggle {
      background: none;
      border: none;
      cursor: pointer;
      width: 100%;
      padding: 0.3rem 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent, var(--terre));
      opacity: 0.55;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    .etape-toggle:hover { opacity: 1; }
    .etape-toggle-arrow {
      font-size: 1.05rem;
      line-height: 1;
      display: inline-block;
      transition: transform 0.25s ease;
    }
    .methode-etape.etape-open .etape-toggle-arrow { transform: rotate(180deg); }

    @media (hover: hover) {
      .methode-etape:hover .etape-details { display: flex; }
      .methode-etape:hover .etape-toggle-arrow { transform: rotate(180deg); }
    }

    .etape-details li {
      font-size: 0.8rem;
      color: var(--gris);
      line-height: 1.5;
      padding-left: 1rem;
      position: relative;
    }

    .etape-details li::before {
      content: '›';
      position: absolute;
      left: 0;
      color: var(--accent, var(--terre));
      font-weight: 700;
    }

    .methode-separator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 0.75rem 0 1rem;
    }
    .sep-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(13,58,30,0.14), transparent);
    }
    .sep-icon {
      font-size: 1.1rem;
      color: var(--terre);
      opacity: 0.65;
      line-height: 1;
    }

    /* ── DOMAINES ── */
    #domaines {
      position: relative;
      background:
        radial-gradient(circle at 8% 10%, rgba(45,125,111,0.10), transparent 28%),
        radial-gradient(circle at 92% 12%, rgba(196,144,74,0.10), transparent 24%),
        linear-gradient(180deg, rgba(248,249,250,0.98), rgba(245,240,232,0.72));
      overflow: hidden;
    }
    #domaines::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(13,58,30,0.05) 1px, transparent 1px),
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.42) 48%, transparent 100%);
      background-size: 28px 28px, 100% 100%;
      opacity: 0.36;
      pointer-events: none;
    }
    #domaines .container { position: relative; }

    .domaines-grille {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-bottom: 2.25rem;
    }

    .domaine-carte {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 1.8rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--line-soft);
      border-top: 3px solid rgba(30,150,96,0.92);
      backdrop-filter: blur(8px);
      transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0 0.6rem;
    }

    .domaine-carte:hover {
      transform: translateY(-4px);
      border-color: rgba(45,125,111,0.18);
      box-shadow: var(--shadow-lift);
    }

    .domaine-icone {
      font-size: 1.8rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .domaine-carte h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--sombre);
      margin-bottom: 0;
      flex: 1;
      min-width: 0;
    }

    .domaine-ex {
      flex: 0 0 100%;
      margin-top: 0.6rem;
    }

    .domaine-ex {
      font-size: 0.82rem;
      color: var(--text-soft);
      line-height: 1.72;
      font-style: italic;
    }

    .domaines-conclusion {
      width: 100%;
      margin: 2.5rem 0 0;
      background: var(--surface-soft);
      border-radius: var(--radius-lg);
      padding: 2rem clamp(1.35rem, 3vw, 2.5rem);
      border: 1px solid var(--line-soft);
      box-shadow: 0 16px 38px rgba(13,58,30,0.07);
      backdrop-filter: blur(10px);
    }

    .domaines-conclusion p {
      font-size: 0.97rem;
      color: var(--text-soft);
      line-height: 1.86;
    }

    .domaines-nexus {
      margin-top: 1.05rem;
      font-size: 0.89rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .domaines-toggle-wrap {
      text-align: center;
      margin: 2rem 0 0;
    }
    .btn-voir-plus {
      background: none;
      border: 2px solid var(--vert);
      color: var(--vert);
      padding: 0.6rem 2rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .btn-voir-plus:hover {
      background: var(--vert);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(45,125,111,0.18);
    }

    /* ── PRINCIPES ── */
    .principes-wrap {
      position: relative;
      margin-top: 1rem;
      padding: 0.8rem clamp(1.2rem, 3vw, 2.2rem) 1.1rem;
      border: 1px solid rgba(13,58,30,0.08);
      border-radius: 24px;
      background:
        radial-gradient(circle at 8% 8%, rgba(212,130,10,0.08), transparent 28%),
        radial-gradient(circle at 92% 12%, rgba(30,150,96,0.075), transparent 26%),
        linear-gradient(145deg, rgba(250,246,238,0.82), rgba(245,240,232,0.70));
      overflow: hidden;
    }
    .principes-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(13,58,30,0.035) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.28;
      pointer-events: none;
    }
    .principes-wrap > * { position: relative; }

    .principes-intro {
      width: 100%;
      max-width: none;
      margin: 0 0 1.9rem;
      font-size: 0.92rem;
      color: var(--text-soft);
      line-height: 1.8;
      text-align: left;
      hyphens: none;
    }

    .principes-edito {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .principe-edito {
      position: relative;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.65s ease, transform 0.65s ease;
      padding: 1.35rem 0 1.3rem;
      border-top: 1px solid rgba(13,58,30,0.10);
      background: transparent;
    }
    .principe-edito:first-child {
      border-top: 0;
      padding-top: 0.7rem;
    }
    .principe-edito::before {
      content: '';
      position: absolute;
      left: 0;
      top: -1px;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(192,104,0,0.76), rgba(30,150,96,0.48));
      transition: width 0.45s ease;
    }
    .principe-edito:hover::before,
    .principe-edito.is-open::before { width: min(132px, 20%); }
    .principe-edito.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .principe-edito-entete {
      display: grid;
      grid-template-columns: minmax(230px, 0.8fr) minmax(320px, 1.2fr);
      align-items: center;
      column-gap: 2rem;
      row-gap: 0.5rem;
      margin-bottom: 0.72rem;
    }

    .principe-edito-icon {
      width: 1rem;
      height: 1rem;
      color: rgba(30,150,96,0.76);
      flex-shrink: 0;
    }

    .principe-edito-titre-wrap {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-width: 0;
    }

    .principe-edito-titre {
      font-size: clamp(0.96rem, 1.1vw, 1.02rem);
      font-weight: 700;
      color: var(--sombre);
      line-height: 1.3;
      margin: 0;
      transition: color 0.25s ease;
    }
    .principe-edito:hover .principe-edito-titre,
    .principe-edito.is-open .principe-edito-titre { color: var(--vert); }

    .principe-edito-phrase {
      max-width: none;
      margin: 0;
      font-size: 0.9rem;
      font-weight: 400;
      font-style: italic;
      color: rgba(13,58,30,0.70);
      line-height: 1.55;
      hyphens: none;
    }

    .principe-edito-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      margin-left: 0;
      border: 0;
      background: transparent;
      padding: 0;
      color: rgba(13,58,30,0.50);
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.25s ease;
    }
    .principe-edito-toggle::after {
      content: '';
      width: 1.45rem;
      height: 1px;
      background: currentColor;
      opacity: 0.42;
      transition: width 0.35s ease, opacity 0.25s ease;
    }
    .principe-edito-toggle::before {
      content: '⌄';
      display: inline-block;
      font-size: 0.82rem;
      line-height: 1;
      opacity: 0.58;
      transform: translateY(-0.05rem);
      transition: transform 0.35s ease, opacity 0.25s ease;
    }
    .principe-edito-toggle:hover { color: var(--vert); }
    .principe-edito-toggle:hover::after {
      width: 1.9rem;
      opacity: 0.72;
    }
    .principe-edito.is-open .principe-edito-toggle::before {
      transform: rotate(180deg) translateY(0.05rem);
      opacity: 0.82;
    }

    .principe-edito-detail {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.5s ease, margin-top 0.5s ease, opacity 0.35s ease;
      opacity: 0;
      margin-top: 0;
    }
    .principe-edito.is-open .principe-edito-detail {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 0.95rem;
    }
    .principe-edito-detail-inner { overflow: hidden; }

    .principe-edito-corps {
      max-width: none;
      width: 100%;
      margin: 0;
      font-size: 0.81rem;
      color: rgba(13,58,30,0.62);
      line-height: 1.8;
    }

    .principe-edito-note {
      width: 100%;
      max-width: none;
      margin-top: 0.85rem;
      padding: 0 0.2rem;
    }

    .principe-edito-note-label {
      display: block;
      margin-bottom: 0.45rem;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: rgba(13,58,30,0.38);
    }

    .principe-edito-note > p {
      max-width: none;
      margin: 0;
      font-size: 0.72rem;
      color: rgba(13,58,30,0.42);
      line-height: 1.65;
      font-style: italic;
      text-align: left;
    }

    /* ── CONTACT ── */
    #contact {
      position: relative;
      background:
        radial-gradient(circle at 12% 14%, rgba(212,130,10,0.08), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(30,150,96,0.08), transparent 24%),
        var(--beige);
      overflow: hidden;
    }
    #contact::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(13,58,30,0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.24;
      pointer-events: none;
    }
    #contact .container { position: relative; }

    .contact-contenu {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 5rem;
      align-items: start;
    }

    .contact-intro h3 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--bleu);
      margin-bottom: 1rem;
    }

    .contact-intro p {
      color: var(--text-soft);
      font-size: 0.97rem;
      line-height: 1.84;
      margin-bottom: 1.5rem;
    }

    .contact-profils { display: flex; flex-direction: column; gap: 0.6rem; }

    .profil-badge {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.9rem;
      color: rgba(13,58,30,0.78);
    }

    .profil-badge::before {
      content: '›';
      color: var(--terre);
      font-weight: 800;
      font-size: 1.2rem;
    }

    .formulaire { display: flex; flex-direction: column; gap: 1rem; }

    .formulaire input,
    .formulaire select,
    .formulaire textarea {
      padding: 0.85rem 1.1rem;
      border: 1.5px solid #D1D5DB;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      background: #fff;
      color: var(--sombre);
    }

    .formulaire input:focus,
    .formulaire select:focus,
    .formulaire textarea:focus {
      border-color: var(--vert);
      box-shadow: 0 0 0 4px rgba(30,150,96,0.10);
    }

    .formulaire textarea { min-height: 120px; resize: vertical; }

    .formulaire .btn-soumettre {
      align-self: flex-start;
      background: var(--vert);
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.85rem 2rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.2s;
    }

    .formulaire .btn-soumettre:hover { background: #226B5E; }

    /* ── CARTOGRAPHIE ── */
    #cartographie {
      background: #0C4A35;
      padding-bottom: 4rem;
    }

    #cartographie .section-en-tete h2  { color: #fff; }
    #cartographie .section-en-tete p.lead { color: rgba(255,255,255,0.65); }

    #globe-zone {
      position: relative;
      height: 600px;
      margin: 2rem 0;
      overflow: hidden;
    }

    #globe-container {
      position: absolute;
      inset: 0;
      cursor: grab;
      touch-action: none;
    }

    #globe-container:active { cursor: grabbing; }

    #globe-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      font-size: 0.85rem;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* Panneau latéral */
    #globe-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 370px;
      height: 100%;
      background: rgba(7, 55, 35, 0.97);
      border-left: 1px solid rgba(255,255,255,0.09);
      overflow-y: auto;
      z-index: 20;
      transform: translateX(105%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #globe-panel.panel-open { transform: translateX(0); }

    /* Contrôles sous le globe */
    #globe-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 2.5rem 0;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .globe-reset-btn {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .globe-reset-btn:hover {
      background: rgba(255,255,255,0.14);
      color: #fff;
    }

    /* Légende */
    #globe-legende {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      flex-wrap: wrap;
    }

    .legende-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.55);
    }

    .legende-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Note bas de section */
    .carte-note {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.32);
      line-height: 1.8;
      width: 100%;
      max-width: none;
      margin: 2rem 0 0;
      text-align: center;
      padding: 0 2.5rem;
    }

    /* ─ Contenu du panneau ─ */
    .panel-header {
      padding: 0.8rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(7, 55, 35, 0.98);
    }

    .panel-country-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.12rem;
    }

    .panel-subtitle {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
    }

    .panel-close-btn,
    .panel-back-btn {
      background: rgba(255,255,255,0.07);
      border: none;
      color: rgba(255,255,255,0.55);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      font-family: inherit;
    }

    .panel-back-btn {
      width: auto;
      height: auto;
      border-radius: 5px;
      padding: 0.28rem 0.7rem;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .panel-close-btn:hover,
    .panel-back-btn:hover {
      background: rgba(255,255,255,0.14);
      color: #fff;
    }

    .panel-body { padding: 1rem 1.2rem 2rem; }

    .panel-project-card {
      display: flex;
      gap: 0.85rem;
      align-items: flex-start;
      padding: 0.85rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 0.55rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .panel-project-card:hover { background: rgba(255,255,255,0.09); }

    .panel-status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .panel-project-card strong {
      display: block;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
      line-height: 1.3;
    }

    .panel-project-card small {
      display: block;
      color: rgba(255,255,255,0.4);
      font-size: 0.73rem;
      line-height: 1.4;
    }

    .panel-card-domain { color: rgba(30,150,96,0.9) !important; }

    .panel-empty {
      color: rgba(255,255,255,0.3);
      font-size: 0.85rem;
      text-align: center;
      padding: 2.5rem 0;
      font-style: italic;
    }

    /* Fiche projet détaillée */
    .panel-project-header {
      padding-bottom: 1.1rem;
      margin-bottom: 1.1rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .panel-status-pill {
      display: inline-block;
      padding: 0.22rem 0.65rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.65rem;
    }

    .panel-project-title {
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.4rem;
    }

    .panel-location {
      color: rgba(255,255,255,0.45);
      font-size: 0.78rem;
      margin-bottom: 0.3rem;
    }

    .panel-domain-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--vert-clair);
      margin-bottom: 0.7rem;
    }

    .panel-support-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      margin-top: 0.5rem;
    }

    .panel-label {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-right: 0.2rem;
    }

    .support-badge {
      padding: 0.18rem 0.55rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .support-financial { background: rgba(192,104,0,0.18);  color: #D4820A; }
    .support-technical { background: rgba(30,150,96,0.18);  color: #1E9660; }
    .support-human     { background: rgba(30,150,96,0.10);  color: #1E9660; }
    .support-material  { background: rgba(212,130,10,0.15); color: #D4820A; }

    .panel-field { margin-bottom: 0.95rem; }

    .panel-field-label {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.33);
      margin-bottom: 0.28rem;
    }

    .panel-field p {
      font-size: 0.83rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.65;
      margin: 0;
    }


    .panel-partners-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .panel-partners-list li {
      font-size: 0.83rem;
      color: rgba(255,255,255,0.7);
      padding: 0.1rem 0;
    }

    .panel-partners-list li::before {
      content: '›';
      color: var(--vert);
      margin-right: 0.4rem;
    }

    .panel-timeline {
      font-size: 0.76rem;
      color: rgba(255,255,255,0.35);
      margin: -0.4rem 0 0.95rem;
      font-style: italic;
    }

    .panel-actions {
      display: flex;
      gap: 0.55rem;
      margin-top: 1.4rem;
      flex-wrap: wrap;
    }

    .panel-btn {
      display: inline-block;
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
      cursor: pointer;
    }

    .panel-btn:hover { opacity: 0.82; }
    .panel-btn-primary   { background: var(--terre); color: #fff; }
    .panel-btn-secondary { background: rgba(255,255,255,0.09); color: #fff; border: 1px solid rgba(255,255,255,0.18); }

    /* Bandeau projet fictif */
    .panel-fictional-banner {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      background: rgba(212, 130, 10, 0.10);
      border: 1px solid rgba(212, 130, 10, 0.28);
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      margin-bottom: 1.1rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.55;
    }
    .panel-fictional-banner strong {
      color: #D4820A;
      font-weight: 700;
    }

    /* Utilitaire */
    .globe-hidden { display: none !important; }

    /* ── Onglets du panneau ── */
    .panel-tabs-bar {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      background: rgba(7,55,35,0.98);
      z-index: 2;
      padding: 0 0.4rem;
      flex-shrink: 0;
    }
    .panel-tab {
      flex: 1;
      padding: 0.78rem 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      color: rgba(255,255,255,0.36);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      margin-bottom: -1px;
    }
    .panel-tab:hover  { color: rgba(255,255,255,0.62); }
    .panel-tab.active { color: #fff; border-bottom-color: var(--terre); }
    .panel-tabs-close {
      background: none;
      border: none;
      color: rgba(255,255,255,0.38);
      width: 38px;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;

    }

      margin-bottom: 1em;
    }

    .enjeu-flux {
      display: flex;
      align-items: stretch;
      margin: 0 auto 60px;
      max-width: 1020px;
    }
    .flux-bloc {
      flex: 1;
      border-radius: 12px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .flux-gauche { background: var(--bleu); }
    .flux-centre { background: var(--terre); }
    .flux-droite { background: var(--vert); }
    .flux-header { display: flex; align-items: center; gap: 0.55rem; }
    .flux-icone { font-size: 1.5rem; line-height: 1; flex-shrink: 0; }
    .flux-bloc h3 {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin: 0;
      color: rgba(255,255,255,0.88);
    }
    .flux-bloc ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .flux-bloc li {
      font-size: 0.86rem;
      color: rgba(255,255,255,0.78);
      padding-left: 16px;
      position: relative;
    }
    .flux-bloc li::before {
      content: '›';
      position: absolute;
      left: 0;
      font-size: 1em;
      opacity: 0.65;
    }

    .flux-connecteur {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      flex-shrink: 0;
    }
    .flux-svg { width: 60px; height: 60px; }
    .flux-line-fwd, .flux-head-fwd { stroke: var(--bleu); }
    .flux-line-bwd, .flux-head-bwd { stroke: var(--vert); }
    @keyframes flux-fwd {
      from { stroke-dashoffset: 20; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes flux-bwd {
      from { stroke-dashoffset: -20; }
      to   { stroke-dashoffset: 0; }
    }
    .flux-line-fwd { animation: flux-fwd 0.9s linear infinite; }
    .flux-line-bwd { animation: flux-bwd 0.9s linear infinite; animation-delay: 0.45s; }

    .approche-sous-titre {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--vert);
      margin: 0 0 0.72rem;

    .enjeu-conclusion {
      position: relative;
      background: var(--surface-soft);
      border-left: 4px solid var(--terre);

      padding: 1.5rem 3.5rem 1.5rem 2rem;
      max-width: 660px;
      margin: 3rem auto;
      box-shadow: var(--shadow-soft);
      border-top: 1px solid var(--line-soft);
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      overflow: hidden;
      text-align: left;
      font-size: 1.05rem;
      font-weight: 600;
      font-style: italic;
      color: var(--sombre);
      line-height: 1.75;
      white-space: normal;
    }
    .enjeu-conclusion::before {
      content: '\201C';
      position: absolute;
      top: 0.2rem;
      right: 1.2rem;
      font-size: 5.5rem;
      line-height: 1;
      color: var(--terre);
      opacity: 0.15;
      font-family: Georgia, 'Times New Roman', serif;
      pointer-events: none;
    }

    /* ── QUI SOMMES-NOUS ── */
    #qui-sommes-nous {
      background:
        radial-gradient(circle at 10% 12%, rgba(192,104,0,0.06), transparent 28%),
        linear-gradient(180deg, var(--beige-fort), var(--beige));
      padding: 4rem 2.5rem;
    }

    .equipe-profil {
      display: flex;
      gap: 2.5rem;
      align-items: flex-start;
      margin-bottom: 2.5rem;
    }

    .equipe-photo-wrap { flex-shrink: 0; }

    .equipe-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      border: 2px solid var(--beige-fort);
      display: block;
    }

    .equipe-texte > span { margin-bottom: 0.5rem; display: block; }

    .equipe-texte h2 {
      font-size: 1.34rem;
      font-weight: 700;
      color: var(--sombre);
      margin-bottom: 0.7rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .equipe-intro {
      font-size: 0.94rem;
      color: var(--text-soft);
      line-height: 1.82;
    }

    .equipe-citation {
      font-size: 0.97rem;
      font-style: italic;
      font-weight: 500;
      color: var(--sombre);
      line-height: 1.92;
      text-align: justify;
      hyphens: none;
      max-width: 700px;
      margin-top: 2.2rem;
      margin-bottom: 0.5rem;
      margin-left: 2rem;
      padding-left: 1.2rem;
      border-left: 2px solid var(--terre);
    }

    .equipe-citation::before {
      content: "\201C";
      color: var(--terre);
      font-size: 1.25em;
      font-style: normal;
      font-weight: 600;
      margin-right: 0.04em;
      vertical-align: -0.05em;
    }

    .equipe-citation::after {
      content: "\201D";
      color: var(--terre);
      font-size: 1.25em;
      font-style: normal;
      font-weight: 600;
      margin-left: 0.04em;
      vertical-align: -0.05em;
    }

    .equipe-linkedin {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.8rem;
      font-size: 0.82rem;
      color: var(--vert);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .equipe-linkedin:hover { opacity: 0.75; }

    .equipe-linkedin-badge {
      background: #0A66C2;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.12rem 0.38rem;
      border-radius: 3px;
      letter-spacing: 0.2px;
      line-height: 1.4;
    }

    .equipe-axes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
      margin-top: 1.5rem;
    }

    .axe-carte {
      background: var(--surface-soft);
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--terre);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 1.1rem 1.3rem;
      box-shadow: var(--shadow-soft);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .axe-carte:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lift);
    }

    .axe-header {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.7rem;
    }

    .axe-icone {
      font-size: 1.05rem;
      flex-shrink: 0;
      line-height: 1;
    }

    .axe-carte h3 {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--sombre);
      margin: 0;
      line-height: 1.3;
    }

    .axe-carte ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
    }

    .axe-carte ul li {
      font-size: 0.81rem;
      color: var(--text-soft);
      padding-left: 0.85rem;
      position: relative;
      line-height: 1.4;
    }

    .axe-carte ul li::before {
      content: '·';
      position: absolute;
      left: 0;
      color: var(--terre);
      font-weight: 700;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .piliers-grille { grid-template-columns: repeat(2, 1fr); }
      .methode-grille { grid-template-columns: 1fr 1fr; }
      .contact-contenu { grid-template-columns: 1fr; gap: 2.5rem; }
      .domaines-grille { grid-template-columns: repeat(2, 1fr); }
      .enjeu-flux { flex-direction: column; }
      .flux-connecteur { width: 100%; height: 60px; }
      .flux-svg { transform: rotate(90deg); }
      /* principes timeline: no change needed at 900px */
      .equipe-axes { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 700px) {
      .methode-grille { grid-template-columns: 1fr; }

      .principe-edito-phrase,
      .principe-edito-toggle,
      .principe-edito-corps { margin-left: 0; }
      nav { padding: 0.8rem 1.2rem; }
      .nav-links { gap: 0.8rem; font-size: 0.8rem; }
      section { padding: 4rem 1.2rem; }
      #globe-zone { height: 420px; }
      #globe-controls { padding: 0.6rem 1.2rem 0; }
      #globe-legende { gap: 0.8rem; }
      .equipe-profil { flex-direction: column; gap: 1.5rem; }
    }

    @media (max-width: 540px) {
      .nav-links { display: none; }
      .hamburger { display: block; }

      .equipe-axes { grid-template-columns: 1fr; }

        border-radius: 14px 14px 0 0;
      }
      #globe-panel.panel-open { transform: translateY(0); }
    }

  <script>
  /* ── GLOBE INIT ── */
  (function () {
    'use strict';

    // ── Couleurs polygones pays ──────────────────────────────────────────────
    const POLY_COLORS = {
      selected: 'rgba(255,255,255,0.18)',
      none:     'rgba(0,0,0,0)'
    };

    // ── État ─────────────────────────────────────────────────────────────────
    let countriesData       = [];
    let selectedISO         = null;   // ISO alpha-3 du pays sélectionné
    let selectedProject     = null;
    let pointJustClicked    = false;  // évite double-clic point + polygone
    let activeTab           = 'carte';
    let projectDetailSource = 'carte'; // 'carte' | 'projets'

    // ── Index pays → projets ─────────────────────────────────────────────────
    const countryMap = {};
    projects.forEach(p => {
      if (!countryMap[p.countryCode]) countryMap[p.countryCode] = [];
      countryMap[p.countryCode].push(p);
    });

    // ── DOM ──────────────────────────────────────────────────────────────────
    const container = document.getElementById('globe-container');
    const panel     = document.getElementById('globe-panel');
    const resetBtn  = document.getElementById('globe-reset');

    // ── Helpers ──────────────────────────────────────────────────────────────
    function getDominantStatus(list) {
      const counts = {};
      list.forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });
      return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    // Centroïde approximatif d'un feature GeoJSON (Polygon ou MultiPolygon)
    function getCentroid(feat) {
      const geom = feat.geometry;
      if (!geom) return { lat: 0, lng: 0 };
      let ring;
      if (geom.type === 'Polygon') {
        ring = geom.coordinates[0];
      } else if (geom.type === 'MultiPolygon') {
        // Utiliser l'anneau du plus grand polygone (le plus de points)
        ring = geom.coordinates
          .map(poly => poly[0])
          .reduce((a, b) => a.length > b.length ? a : b);
      } else {
        return { lat: 0, lng: 0 };
      }
      const sum = ring.reduce((acc, c) => ({ x: acc.x + c[0], y: acc.y + c[1] }), { x: 0, y: 0 });
      return { lat: sum.y / ring.length, lng: sum.x / ring.length };
    }

    function t(key) {
      let lang = 'fr';
      try { lang = localStorage.getItem('lang') || 'fr'; } catch(e) {}
      const keys = key.split('.');
      return keys.reduce((obj, k) => obj?.[k], translations[lang]) || key;
    }

    function pField(p, f) {
      let lang = 'fr';
      try { lang = localStorage.getItem('lang') || 'fr'; } catch(e) {}
      if (lang !== 'fr') { const v = p[f + '_en']; if (v !== undefined) return v; }
      return p[f];
    }

    // ── Globe init ───────────────────────────────────────────────────────────
    if (typeof Globe !== 'function') {
      container.innerHTML = '<p style="color:rgba(255,255,255,0.4);padding:2rem;text-align:center">Error: unable to load the globe library</p>';
      return;
    }

    let globe;
    try {
      globe = Globe()
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-day.jpg')
        .atmosphereColor('#C0A8D8')
        .atmosphereAltitude(0.15)
        .backgroundColor('#0C4A35')
        .polygonsData([])
        .polygonGeoJsonGeometry(feat => feat.geometry)
        .polygonCapColor(() => POLY_COLORS.none)
        .polygonSideColor(() => 'rgba(0,0,0,0)')
        .polygonStrokeColor(() => 'rgba(0,0,0,0)')
        .polygonAltitude(feat => feat.properties?.ISO_A3 === selectedISO ? 0.016 : 0.008)
        .onPolygonClick((feat, evt) => {
          if (pointJustClicked) return;
          handleCountryClick(feat);
        })
        .onPolygonHover(feat => {
          const iso = feat?.properties?.ISO_A3;
          container.style.cursor = (feat && iso && iso !== '-99') ? 'pointer' : 'grab';
        })
        .htmlElementsData(projects)
        .htmlLat('lat')
        .htmlLng('lng')
        .htmlAltitude(0.01)
        .htmlElement(p => {
          const color  = STATUS_COLORS[p.status];
          const el     = document.createElement('div');
          el.setAttribute('data-globe-pin', '');
          el.style.cssText = 'position:relative;width:18px;height:26px;cursor:pointer;transform:translate(-50%,-100%);pointer-events:auto';
          const head   = document.createElement('div');
          head.style.cssText = `position:absolute;top:0;left:0;width:18px;height:18px;border-radius:50%;background:${color};box-shadow:0 1px 5px rgba(0,0,0,0.4)`;
          const tail   = document.createElement('div');
          tail.style.cssText = `position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid ${color}`;
          el.appendChild(head);
          el.appendChild(tail);
          el.addEventListener('click', evt => {
            evt.stopPropagation();
            pointJustClicked = true;
            setTimeout(() => { pointJustClicked = false; }, 80);
            projectDetailSource = 'carte';
            handleProjectClick(p);
          });
          return el;
        })
        (container);
    } catch (err) {
      container.innerHTML = '<p style="color:rgba(255,100,100,0.8);padding:2rem;text-align:center;font-size:0.85rem">Globe error: ' + err.message + '</p>';
      return;
    }

    // Vue initiale centrée sur le monde (10°N / 20°E — zone neutre, non eurocentrée)
    globe.pointOfView({ lat: 2, lng: 25, altitude: 2.5 });

    // Redimensionnement responsive
    function resizeGlobe() {
      globe.width(container.clientWidth).height(container.clientHeight);
    }
    window.addEventListener('resize', resizeGlobe);
    resizeGlobe();

    // Éclairage uniforme : supprime l'effet "soleil" de Three.js → couleurs unies
    setTimeout(() => {
      try {
        globe.scene().traverse(obj => {
          if (obj.isAmbientLight)    { obj.intensity = 1.0; obj.color.set(0xffffff); }
          if (obj.isDirectionalLight) { obj.intensity = 0; }
        });
      } catch(e) {}
    }, 0);

    // Corrige le pinch-to-zoom mobile : l'overlay htmlElementsData de Globe.gl
    // peut bloquer les touch events vers le canvas. On cible uniquement ce div
    // (parent direct de nos pins) sans toucher aux divs de contrôle du globe.
    setTimeout(() => {
      const pin = container.querySelector('[data-globe-pin]');
      if (!pin) return;
      let overlay = pin.parentElement;
      while (overlay && overlay.parentElement !== container) {
        overlay = overlay.parentElement;
      }
      if (overlay && overlay !== container) {
        overlay.style.pointerEvents = 'none';
      }
    }, 300);

    // Le globe est rendu — masquer le texte de chargement immédiatement
    const loadingEl = document.getElementById('globe-loading');
    if (loadingEl) loadingEl.style.display = 'none';

    // ── Frontières pays (fichier local countries.js — pas de fetch réseau) ────
    if (typeof COUNTRIES_GEOJSON !== 'undefined') {
      countriesData = COUNTRIES_GEOJSON.features;
      globe.polygonsData(countriesData);
    }

    // ── Gestionnaires d'événements ───────────────────────────────────────────
    function handleCountryClick(feat) {
      if (!feat) return;
      const iso = feat.properties?.ISO_A3;
      if (!iso || iso === '-99') return;

      const countryProjects = countryMap[iso] || [];
      if (!countryProjects.length) return;

      selectedISO = iso;
      selectedProject = null;
      globe.polygonsData([...countriesData]);

      const centroid = getCentroid(feat);
      globe.pointOfView({ lat: centroid.lat, lng: centroid.lng, altitude: 0.5 }, 1200);
      globe.controls().autoRotate = false;
      resetBtn.classList.remove('globe-hidden');

      if (countryProjects.length === 1) {
        projectDetailSource = 'carte';
        handleProjectClick(countryProjects[0]);
      } else {
        const name = feat.properties?.ADMIN || feat.properties?.NAME || iso;
        showCountryPanel(name, countryProjects);
      }
    }

    function handleProjectClick(project) {
      selectedProject = project;
      globe.controls().autoRotate = false;
      showProjectPanel(project);
    }

    resetBtn.addEventListener('click', () => {
      selectedISO = null;
      selectedProject = null;
      globe.polygonsData([...countriesData]);
      globe.pointOfView({ lat: 2, lng: 25, altitude: 2.5 }, 1000);
      globe.controls().autoRotate = true;
      closePanel();
      resetBtn.classList.add('globe-hidden');
    });

    // ── Onglets du panneau ──────────────────────────────────────────────────

    function panelWrap(tab, bodyHTML) {
      return `<div class="panel-tabs-bar">
          <button class="panel-tab${tab==='carte'?' active':''}" data-tab="carte">${t('carte.tab_carte')}</button>
          <button class="panel-tab${tab==='projets'?' active':''}" data-tab="projets">${t('carte.tab_projets')}</button>
          <button class="panel-tabs-close" id="panel-close">×</button>
        </div>${bodyHTML}`;
    }

    function bindPanelBase() {
      panel.querySelector('#panel-close')?.addEventListener('click', () => {
        closePanel();
        selectedISO = null;
        selectedProject = null;
        globe.controls().autoRotate = true;
        if (countriesData.length) globe.polygonsData([...countriesData]);
        resetBtn.classList.add('globe-hidden');
      });
      panel.querySelectorAll('.panel-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;
          if (tab === activeTab) return;
          if (tab === 'projets') showProjectsTab();
          else showCarteTab();
        });
      });
    }

    function openPanel()  { panel.classList.add('panel-open'); }
    function closePanel() { panel.classList.remove('panel-open'); }

    window.globePanelClose = () => {
      closePanel();
      selectedISO = null;
      selectedProject = null;
      resetBtn.classList.add('globe-hidden');
    };

    function showCarteTab() {
      activeTab = 'carte';
      if (selectedProject) { showProjectPanel(selectedProject); return; }
      if (selectedISO && countriesData.length) {
        const feat = countriesData.find(f => f.properties?.ISO_A3 === selectedISO);
        if (feat) { showCountryPanel(feat.properties?.ADMIN || feat.properties?.NAME || selectedISO, countryMap[selectedISO] || []); return; }
      }
      panel.innerHTML = panelWrap('carte', `<p class="panel-idle">${t('carte.carte_idle')}</p>`);
      bindPanelBase();
      openPanel();
    }

    function showCountryPanel(countryName, countryProjects) {
      activeTab = 'carte';
      const cardsHTML = countryProjects.length === 0
        ? `<p class="panel-empty">${t('carte.panel_no_projects')}</p>`
        : countryProjects.map(p => `
            <div class="panel-project-card" data-id="${p.id}">
              <span class="panel-status-dot" style="background:${STATUS_COLORS[p.status]}"></span>
              <div>
                <strong>${pField(p, 'title')}</strong>
                <small>${[p.city, pField(p, 'region')].filter(Boolean).join(' · ')}</small>
                <small class="panel-card-domain">${pField(p, 'domain')}</small>
              </div>
            </div>`).join('');

      panel.innerHTML = panelWrap('carte', `
        <div class="panel-header">
          <div>
            <p class="panel-country-name">${countryName}</p>
            <p class="panel-subtitle">${countryProjects.length} ${t('carte.panel_country_intro')}</p>
          </div>
        </div>
        <div class="panel-body">${cardsHTML}</div>`);

      bindPanelBase();
      panel.querySelectorAll('.panel-project-card').forEach(card => {
        card.addEventListener('click', () => {
          const proj = projects.find(p => p.id === card.dataset.id);
          if (proj) { projectDetailSource = 'carte'; handleProjectClick(proj); }
        });
      });
      openPanel();
    }

    function showProjectPanel(project) {
      const isFromProjets = projectDetailSource === 'projets';
      activeTab = isFromProjets ? 'projets' : 'carte';

      const lp = Object.assign({}, project, {
        title:               pField(project, 'title'),
        country:             pField(project, 'country'),
        region:              pField(project, 'region'),
        domain:              pField(project, 'domain'),
        summary:             pField(project, 'summary'),
        localNeeds:          pField(project, 'localNeeds'),
        localResources:      pField(project, 'localResources'),
        localPartners:       pField(project, 'localPartners'),
        targetBeneficiaries: pField(project, 'targetBeneficiaries'),
        timeline:            pField(project, 'timeline'),
        impact:              pField(project, 'impact'),
        followUp:            pField(project, 'followUp'),
      });

      const statusLabels = {
        needs_support:      t('carte.status_needs'),
        in_progress:        t('carte.status_progress'),
        completed_followed: t('carte.status_done')
      };
      const supportLabels = {
        financial: t('carte.support_financial'), technical: t('carte.support_technical'),
        human:     t('carte.support_human'),     material:  t('carte.support_material')
      };
      const color = STATUS_COLORS[project.status];
      const supportBadges = (project.supportNeeds || [])
        .map(s => `<span class="support-badge support-${s}">${supportLabels[s]||s}</span>`).join('');
      const partnersHTML = (lp.localPartners || []).map(p => `<li>${p}</li>`).join('');
      const backLabel = isFromProjets ? t('carte.projets_back') : (selectedISO ? t('carte.panel_back') : t('carte.panel_close'));

      function field(label, value) {
        if (!value) return '';
        return `<div class="panel-field"><span class="panel-field-label">${label}</span><p>${value}</p></div>`;
      }

      const fictionalBanner = project.fictional
        ? `<div class="panel-fictional-banner"><strong>${t('carte.fictional_banner_label')}</strong> — ${t('carte.fictional_banner_text')}</div>`
        : '';

      panel.innerHTML = panelWrap(activeTab, `
        <div class="panel-header">
          <button class="panel-back-btn" id="panel-back">${backLabel}</button>
        </div>
        <div class="panel-body">
          ${fictionalBanner}
          <div class="panel-project-header">
            <span class="panel-status-pill" style="background:${color}22;color:${color};border:1px solid ${color}55">
              ${statusLabels[project.status]||project.status}
            </span>
            <p class="panel-project-title">${lp.title}</p>
            <p class="panel-location">&#128205; ${[project.city, lp.region, lp.country].filter(Boolean).join(', ')}</p>
            <p class="panel-domain-tag">${lp.domain}</p>
            ${supportBadges ? `<div class="panel-support-badges"><span class="panel-label">${t('carte.panel_needs_label')}</span>${supportBadges}</div>` : ''}
          </div>
          ${field(t('carte.panel_summary'),         lp.summary)}
          ${field(t('carte.panel_local_needs'),     lp.localNeeds)}
          ${field(t('carte.panel_local_resources'), lp.localResources)}
          ${partnersHTML ? `<div class="panel-field"><span class="panel-field-label">${t('carte.panel_partners')}</span><ul class="panel-partners-list">${partnersHTML}</ul></div>` : ''}
          ${field(t('carte.panel_beneficiaries'), lp.targetBeneficiaries)}
          ${lp.timeline ? `<p class="panel-timeline">&#9201; ${lp.timeline}</p>` : ''}
          ${field(t('carte.panel_impact'),   lp.impact)}
          ${field(t('carte.panel_followup'), lp.followUp)}
          <div class="panel-actions">
            <a href="projects.html#${project.id}" class="panel-btn panel-btn-primary">${t('carte.btn_full_project')}</a>
            <a href="index.html#contact" class="panel-btn panel-btn-secondary" onclick="globePanelClose()">${t('carte.panel_btn_contact')}</a>
          </div>
        </div>`);

      bindPanelBase();
      document.getElementById('panel-back')?.addEventListener('click', () => {
        if (isFromProjets) { showProjectsTab(); return; }
        if (selectedISO && countriesData.length) {
          const feat = countriesData.find(f => f.properties?.ISO_A3 === selectedISO);
          if (feat) { showCountryPanel(feat.properties?.ADMIN || feat.properties?.NAME || selectedISO, countryMap[selectedISO] || []); return; }
        }
        closePanel(); resetBtn.classList.add('globe-hidden');
      });
      openPanel();
    }

    function showProjectsTab() {
      activeTab = 'projets';

      const byContinent = {};
      projects.forEach(p => {
        const cont = p.continent || 'other';
        if (!byContinent[cont]) byContinent[cont] = {};
        const cKey = pField(p, 'country');
        if (!byContinent[cont][cKey]) byContinent[cont][cKey] = [];
        byContinent[cont][cKey].push(p);
      });

      const continentsHTML = Object.entries(byContinent).map(([cont, countries]) => {
        const countriesHTML = Object.entries(countries).map(([country, cps]) => {
          const cardsHTML = cps.map(p => `
            <div class="panel-project-card" data-id="${p.id}">
              <span class="panel-status-dot" style="background:${STATUS_COLORS[p.status]}"></span>
              <div>
                <strong>${pField(p, 'title')}</strong>
                <small>${[p.city, pField(p, 'region')].filter(Boolean).join(' · ')}</small>
              </div>
            </div>`).join('');
          return `<div class="projets-country-section">
            <div class="projets-country-title">${country}</div>
            ${cardsHTML}
          </div>`;
        }).join('');
        return `<div class="projets-continent-section">
          <div class="projets-continent-title">${t('continents.' + cont)}</div>
          ${countriesHTML}
        </div>`;
      }).join('');

      panel.innerHTML = panelWrap('projets',
        projects.length === 0
          ? `<p class="panel-idle">${t('carte.projets_empty')}</p>`
          : `<div class="projets-list">${continentsHTML}</div>`
      );
      bindPanelBase();
      panel.querySelectorAll('.panel-project-card').forEach(card => {
        card.addEventListener('click', () => {
          const proj = projects.find(p => p.id === card.dataset.id);
          if (!proj) return;
          projectDetailSource = 'projets';
          selectedISO = proj.countryCode;
          selectedProject = proj;
          globe.controls().autoRotate = false;
          globe.pointOfView({ lat: proj.lat, lng: proj.lng, altitude: 1.0 }, 1000);
          if (countriesData.length) globe.polygonsData([...countriesData]);
          showProjectPanel(proj);
          resetBtn.classList.remove('globe-hidden');
        });
      });
      openPanel();
    }

    // ── Re-rendu du panneau au changement de langue ──────────────────────────
    document.addEventListener('langchange', () => {
      if (!panel.classList.contains('panel-open')) return;
      if (activeTab === 'projets') { showProjectsTab(); return; }
      if (selectedProject) { showProjectPanel(selectedProject); return; }
      if (selectedISO && countriesData.length) {
        const feat = countriesData.find(f => f.properties?.ISO_A3 === selectedISO);
        if (feat) showCountryPanel(feat.properties?.ADMIN || feat.properties?.NAME || selectedISO, countryMap[selectedISO] || []);
      }
    });

    // ── Bouton "Liste des projets" ───────────────────────────────────────────
    document.getElementById('globe-projets-btn')?.addEventListener('click', () => {
      window.location.href = 'projects.html';
    });

    // ── Filtres (préparés, non encore exposés en UI) ─────────────────────────
    let filterState = { status: null, domain: null, supportType: null };

    function applyFilters() {
      const filtered = projects.filter(p => {
        if (filterState.status      && p.status !== filterState.status) return false;
        if (filterState.domain      && p.domain !== filterState.domain) return false;
        if (filterState.supportType && !p.supportNeeds?.includes(filterState.supportType)) return false;
        return true;
      });
      globe.htmlElementsData(filtered);
    }

    // API publique pour les futurs boutons filtres
    window.setGlobeFilter   = (k, v) => { filterState[k] = v; applyFilters(); };
    window.resetGlobeFilter = ()      => { filterState = {}; globe.htmlElementsData(projects); };

  }());

  </script>

  <script>
    var _domainesExpanded = false;
    function togglePilier(el) { el.classList.toggle('active'); }
  </script>

  <script>
    (function() {
      var items = document.querySelectorAll('.principe-edito');
      if (!items.length) return;
      if (!window.IntersectionObserver) {
        items.forEach(function(el) { el.classList.add('visible'); });
        return;
      }
      var obs = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08 });
      items.forEach(function(el, i) {
        el.style.transitionDelay = (i * 0.07) + 's';
        obs.observe(el);
      });
    })();
  </script>

  <script>
    document.querySelectorAll('.principe-edito').forEach(function(panel) {
      var button = panel.querySelector('.principe-edito-toggle');
      if (!button) return;
      button.addEventListener('click', function() {
        var isOpen = panel.classList.toggle('is-open');
        var lang = document.documentElement.lang || 'fr';
        button.textContent = translations[lang].principes[isOpen ? 'detail_close' : 'detail_toggle'];
      });
    });
  </script>

  <script>
    document.querySelectorAll('.methode-etape').forEach(function(card) {
      var details = card.querySelector('.etape-details');
      if (!details) return;
      var btn = document.createElement('button');
      btn.className = 'etape-toggle';
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = '<span class="etape-toggle-arrow">&#8964;</span>';
      details.insertAdjacentElement('beforebegin', btn);
      btn.addEventListener('click', function() {
        var isOpen = card.classList.toggle('etape-open');
        details.classList.toggle('open', isOpen);
        btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
    });
  </script>

  <script>
    function toggleDomaines(btn) {
      _domainesExpanded = !_domainesExpanded;
      var cartes = document.querySelectorAll('#domaines .domaine-carte');
      for (var i = 3; i < cartes.length; i++) {
        cartes[i].style.display = _domainesExpanded ? '' : 'none';
      }
      try {
        var lang = document.documentElement.lang || 'fr';
        var key = _domainesExpanded ? 'voir_moins' : 'voir_plus';
        btn.setAttribute('data-i18n', 'domaines.' + key);
        btn.textContent = translations[lang].domaines[key];
      } catch(e) {
        btn.textContent = _domainesExpanded ? 'Voir moins' : 'Voir plus';
      }
    }
  </script>

  <script>
    function envoyerContact(e) {
      e.preventDefault();
      var btn     = document.getElementById('contact-btn');
      var success = document.getElementById('contact-success');
      var error   = document.getElementById('contact-error');
      var lang    = document.documentElement.lang || 'fr';

      success.style.display = 'none';
      error.style.display   = 'none';
      btn.disabled = true;
      btn.textContent = lang === 'en' ? 'Sending…' : 'Envoi en cours…';

      var data = new FormData(document.getElementById('contact-form'));

      fetch('https://formspree.io/f/xkoylllv', {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      })
      .then(function(res) {
        if (res.ok) {
          document.getElementById('contact-form').reset();
          success.style.display = 'block';
          success.textContent = lang === 'en'
            ? 'Message sent! We will get back to you shortly.'
            : 'Message envoyé ! Nous vous répondrons dans les meilleurs délais.';
          btn.disabled = false;
          btn.textContent = lang === 'en' ? 'Send another message ›' : 'Envoyer un autre message ›';
        } else {
          throw new Error();
        }
      })
      .catch(function() {
        error.style.display = 'block';
        error.textContent = lang === 'en'
          ? 'An error occurred. Please try again or write to contact@linkovia-network.org.'
          : 'Une erreur est survenue. Réessayez ou écrivez directement à contact@linkovia-network.org.';
        btn.disabled = false;
        btn.textContent = lang === 'en' ? 'Send message ›' : 'Envoyer le message ›';
      });
    }
  </script>

  <script>
    function toggleMobileMenu() {
      document.getElementById('mobile-menu').classList.toggle('open');
    }
    function closeMobileMenu() {
      document.getElementById('mobile-menu').classList.remove('open');
    }
    document.addEventListener('click', function(e) {
      var menu = document.getElementById('mobile-menu');
      var btn  = document.getElementById('hamburger-btn');
      if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) {
        menu.classList.remove('open');
      }
    });
  </script>

</body>
