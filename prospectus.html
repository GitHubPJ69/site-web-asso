  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange:      #C06800;
      --orange-fort: #A05600;
      --orange-clr:  #E08820;
      --vert:        #1E9660;
      --vert-clair:  #28A870;
      --terre:       #D4820A;
      --beige:       #F5F0E8;
      --beige-fort:  #EDE7D9;
      --gris:        #5A6A5E;
      --sombre:      #0D3A1E;
      --blanc:       #FFFFFF;
      --surface:     rgba(255,255,255,0.86);
      --line-soft:   rgba(13,58,30,0.09);
      --shadow-soft: 0 10px 24px rgba(13,58,30,0.07);
      --shadow-lift: 0 16px 34px rgba(13,58,30,0.11);
      --radius-sm:   8px;
      --radius-md:   14px;
      --radius-lg:   18px;
      --radius-xl:   24px;
      --text-soft:   rgba(13,58,30,0.74);
      --text-muted:  rgba(13,58,30,0.58);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
      color: var(--sombre);
      line-height: 1.6;
      letter-spacing: -0.01em;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(30,150,96,0.10), transparent 60%),
        radial-gradient(1100px 620px at 100% 110%, rgba(192,104,0,0.10), transparent 55%),
        var(--beige);
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.6rem; background: rgba(12, 74, 53, 0.97); color: #fff;
      gap: 1rem; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: #fff; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      object-fit: contain; display: block;
    }
    .brand-name { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-name b { font-weight: 800; font-size: 1.02rem; }
    .brand-name span { font-size: 0.72rem; opacity: 0.75; letter-spacing: 0.14em; text-transform: uppercase; }
    .topbar-right { display: flex; align-items: center; gap: 0.9rem; }
    .lang-switcher { display: flex; gap: 0.25rem; }
    .lang-switcher button {
      background: transparent; color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.28);
      border-radius: 999px; font-family: inherit; font-size: 0.75rem; font-weight: 700;
      padding: 0.3rem 0.7rem; cursor: pointer; transition: all 0.2s;
    }
    .lang-switcher button:hover { color: #fff; border-color: rgba(255,255,255,0.6); }
    .lang-switcher button.active { background: #fff; color: var(--sombre); border-color: #fff; }
    .topbar-link,
    .topbar-button {
      color: #fff; text-decoration: none; font-size: 0.85rem; font-weight: 600;
      border: 1.5px solid rgba(255,255,255,0.5); padding: 0.45rem 1rem; border-radius: 999px;
      transition: all 0.2s; white-space: nowrap;
    }
    .topbar-link:hover,
    .topbar-button:hover { background: rgba(255,255,255,0.12); border-color: #fff; }
    .topbar-button {
      background: transparent; font-family: inherit; cursor: pointer;
    }

    /* ── DECK ── */
    .deck { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.2rem 1.2rem; }
    .stage { width: 100%; max-width: 1000px; position: relative; }

    .slide { display: none; animation: fade 0.45s ease; }
    .slide.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .card {
      background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lift); padding: 2.6rem clamp(1.4rem, 4vw, 3.2rem); backdrop-filter: blur(6px);
    }

    .tag {
      display: inline-block; padding: 0.3rem 0.9rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1.1rem;
    }
    .tag-vert  { background: rgba(30,150,96,0.13); color: var(--vert); border: 1px solid rgba(30,150,96,0.18); }
    .tag-orange{ background: rgba(192,104,0,0.13); color: var(--orange); border: 1px solid rgba(192,104,0,0.18); }
    .tag-terre { background: rgba(212,130,10,0.14); color: var(--terre); border: 1px solid rgba(212,130,10,0.18); }

    h1 { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 800; line-height: 1.12; letter-spacing: -0.03em; color: var(--sombre); }
    h2 { font-size: clamp(1.6rem, 3.6vw, 2.4rem); font-weight: 800; line-height: 1.18; letter-spacing: -0.03em; color: var(--orange); margin-bottom: 0.7rem; }
    .lead { font-size: clamp(1rem, 1.6vw, 1.12rem); color: var(--text-soft); line-height: 1.8; }

    .cover { text-align: center; }
    .cover .kicker { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.22em; color: var(--vert); margin-bottom: 1.1rem; }
    .cover h1 { margin-bottom: 1.1rem; }
    .cover .lead { max-width: 640px; margin: 0 auto 1.8rem; }
    .cover .cover-link {
      display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;
      background: var(--orange); color: #fff; font-weight: 700; font-size: 0.98rem;
      padding: 0.85rem 1.7rem; border-radius: var(--radius-sm); transition: background 0.2s;
    }
    .cover .cover-link:hover { background: var(--orange-fort); }
    .site-url { display: block; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.02em; }
    .audience-row { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 2rem; }
    .audience-chip {
      background: var(--blanc); border: 1px solid var(--line-soft); border-radius: var(--radius-md);
      padding: 0.9rem 1.2rem; font-size: 0.9rem; font-weight: 600; color: var(--sombre);
      box-shadow: var(--shadow-soft);
    }

    .steps { display: grid; gap: 0.9rem; margin-top: 1.6rem; }
    .step {
      display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start;
      background: var(--blanc); border: 1px solid var(--line-soft); border-radius: var(--radius-md);
      padding: 1.1rem 1.3rem; box-shadow: var(--shadow-soft);
    }
    .step-num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.95rem; color: #fff; background: var(--vert); }
    .slide-soutien .step-num { background: var(--orange); }
    .step h3 { font-size: 1.02rem; font-weight: 700; margin-bottom: 0.15rem; }
    .step p { font-size: 0.92rem; color: var(--text-soft); line-height: 1.6; }
    .hl { color: var(--orange); font-weight: 700; }
    .hlv { color: var(--vert); font-weight: 700; }

    .duree-row { display: flex; gap: 0.6rem; margin-top: 0.5rem; flex-wrap: wrap; }
    .duree { font-size: 0.82rem; font-weight: 700; color: var(--vert); background: rgba(30,150,96,0.10); border: 1px solid rgba(30,150,96,0.22); border-radius: 999px; padding: 0.25rem 0.8rem; }

    .note { margin-top: 1.3rem; font-size: 0.88rem; color: var(--text-soft); background: rgba(212,130,10,0.09); border-left: 3px solid var(--terre); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 0.85rem 1.1rem; }

    .flow { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: stretch; margin-top: 1.4rem; }
    .flow-col { display: grid; gap: 0.8rem; }
    .flow-head { text-align: center; font-weight: 800; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; padding: 0.55rem; border-radius: var(--radius-sm); }
    .flow-head.terrain { color: var(--vert); background: rgba(30,150,96,0.12); }
    .flow-head.soutien { color: var(--orange); background: rgba(192,104,0,0.12); }
    .flow-box { background: var(--blanc); border: 1px solid var(--line-soft); border-radius: var(--radius-md); padding: 0.85rem 1rem; box-shadow: var(--shadow-soft); font-size: 0.86rem; }
    .flow-box b { display: block; font-size: 0.82rem; margin-bottom: 0.15rem; }
    .flow-box.terrain b { color: var(--vert); }
    .flow-box.soutien b { color: var(--orange); }
    .flow-box p { color: var(--text-soft); font-size: 0.82rem; line-height: 1.5; }
    .flow-mid { display: grid; place-items: center; }
    .flow-hub { writing-mode: vertical-rl; text-orientation: mixed; background: linear-gradient(180deg, var(--vert), var(--orange)); color: #fff; font-weight: 800; font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 1.2rem 0.7rem; border-radius: var(--radius-md); box-shadow: var(--shadow-soft); display: grid; place-items: center; height: 100%; }
    .flow-note { text-align: center; margin-top: 1.2rem; font-size: 0.9rem; color: var(--text-soft); }

    .cta { text-align: center; }
    .cta h2 { color: var(--sombre); }
    .cta .lead { max-width: 620px; margin: 0.6rem auto 1.8rem; }
    .cta-btns { display: flex; gap: 0.9rem; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; padding: 0.85rem 1.7rem; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.96rem; transition: all 0.2s; }
    .btn-principal { background: var(--orange); color: #fff; }
    .btn-principal:hover { background: var(--orange-fort); }
    .btn-contour { background: transparent; color: var(--sombre); border: 1.5px solid var(--line-soft); }
    .btn-contour:hover { border-color: var(--vert); color: var(--vert); }

    .controls { display: flex; align-items: center; justify-content: center; gap: 1.4rem; padding: 0.4rem 1rem 1.8rem; }
    .arrow { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; background: var(--blanc); color: var(--sombre); box-shadow: var(--shadow-soft); font-size: 1.3rem; display: grid; place-items: center; transition: all 0.2s; }
    .arrow:hover:not(:disabled) { background: var(--vert); color: #fff; transform: translateY(-2px); }
    .arrow:disabled { opacity: 0.35; cursor: default; }
    .dots { display: flex; gap: 0.55rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; border: none; cursor: pointer; background: rgba(13,58,30,0.18); transition: all 0.2s; padding: 0; }
    .dot.active { background: var(--orange); transform: scale(1.25); }
    .counter { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; min-width: 42px; text-align: center; }

    footer { text-align: center; padding: 1rem; font-size: 0.78rem; background: rgba(12, 74, 53, 0.97); color: rgba(255,255,255,0.75); }
    footer a { color: inherit; opacity: 0.75; text-decoration: none; }
    footer a:hover { opacity: 1; text-decoration: underline; }

    @media (max-width: 720px) {
      .card { padding: 1.8rem 1.3rem; }
      .flow { grid-template-columns: 1fr; }
      .flow-mid { display: none; }
      .flow-hub { writing-mode: horizontal-tb; height: auto; padding: 0.7rem; }
      .topbar-link { display: none; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="images/logo-navbar.png" alt="Linkovia Network" />

    <div class="topbar-right">
      <button class="topbar-button" type="button" data-i18n="back_btn" onclick="goBackOrHome()"></button>

        <button data-lang="fr">FR</button>
        <button data-lang="en">EN</button>

  </div>

  <main class="deck">
    <div class="stage">

      <!-- SLIDE 0 : COUVERTURE -->
      <section class="slide active">
        <div class="card cover">

          <h1 data-i18n="cover_h1"></h1>

          <div class="audience-row">

      <!-- SLIDE 1 : PROJETS LOCAUX -->
      <section class="slide slide-terrain">

      <!-- SLIDE 2 : ASSOS DE SOLIDARITÉ -->
      <section class="slide slide-soutien">

          </div>
        </div>
      </section>

      <!-- SLIDE 3 : COMMENT SE FAIT LE LIEN -->
      <section class="slide">
        <div class="card">
          <span class="tag tag-terre" data-i18n="l_tag"></span>
          <h2 data-i18n="l_h2"></h2>
          <p class="lead" data-i18n="l_lead"></p>
          <div class="flow">
            <div class="flow-col">
              <div class="flow-head terrain" data-i18n="l_head_t"></div>
              <div class="flow-box terrain" data-i18n="l_box_t1"></div>
              <div class="flow-box terrain" data-i18n="l_box_t2"></div>
              <div class="flow-box terrain" data-i18n="l_box_t3"></div>
            </div>
            <div class="flow-mid"><div class="flow-hub" data-i18n="l_hub"></div></div>
            <div class="flow-col">
              <div class="flow-head soutien" data-i18n="l_head_s"></div>
              <div class="flow-box soutien" data-i18n="l_box_s1"></div>
              <div class="flow-box soutien" data-i18n="l_box_s2"></div>
              <div class="flow-box soutien" data-i18n="l_box_s3"></div>
            </div>
          </div>
          <p class="flow-note" data-i18n="l_note"></p>
        </div>
      </section>

      <!-- SLIDE 4 : CTA -->
      <section class="slide">
        <div class="card cta">
          <span class="tag tag-vert" data-i18n="c_tag"></span>

  <div class="controls">

  <script>
    /* ── Traductions ── */
    const I18N = {
      fr: {
        back_btn: `Retour`,
        kicker: `Comprendre le terrain, créer des liens`,
        cover_h1: `Relier les initiatives locales<br>aux réseaux qui peuvent les soutenir`,
        cover_lead: `Linkovia Network donne de la visibilité aux initiatives locales de développement et les met en relation, de façon ciblée, avec les partenaires, financeurs et bénévoles internationaux. Pas de projet conçu à leur place : de l'écoute, de la documentation, des mises en relation.`,

        t_tag: `Côté terrain`,
        t_h2: `Vous portez un projet local`,

        t_s4_h: `Vous choisissez la durée de visibilité`,
        t_s4_p: `Le projet reste affiché pour la période que vous décidez :`,
        t_duree: `<span class="duree">1 an</span><span class="duree">3 ans</span><span class="duree">5 ans</span>`,
        t_note: `<b>Un projet déjà accompagné ailleurs ?</b> Si vous vous rétractez ou si votre projet trouve un soutien par un autre canal, contactez-nous pour le retirer de la carte. On évite ainsi de laisser en ligne un projet déjà suivi.`,
        s_tag: `Côté soutien`,
        s_h2: `Vous êtes une association de solidarité internationale`,
        s_lead: `Financeurs, fondations, ONG de développement, experts, bénévoles : trouvez des initiatives de terrain qui correspondent vraiment à votre champ d'action.`,
        s_s1_h: `Vous explorez la carte du monde`,

    function goBackOrHome() {
      if (window.history.length > 1 && document.referrer && document.referrer !== window.location.href) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    function setLang(lang) {
      if (!I18N[lang]) lang = 'fr';
      const dict = I18N[lang];
      document.documentElement.lang = lang;
      localStorage.setItem('lang', lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (dict[k] != null) el.innerHTML = dict[k];
      });
      document.querySelectorAll('#lang-switcher button').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-lang') === lang);
      });
    }
    document.querySelectorAll('#lang-switcher button').forEach(b => {
      b.addEventListener('click', () => setLang(b.getAttribute('data-lang')));
    });

    /* ── Navigation slides ── */
    const slides = Array.from(document.querySelectorAll('.slide'));
    const dotsWrap = document.getElementById('dots');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const counter = document.getElementById('counter');
    let i = 0;

    slides.forEach((_, idx) => {
      const d = document.createElement('button');
      d.className = 'dot' + (idx === 0 ? ' active' : '');
      d.setAttribute('aria-label', 'Vue ' + (idx + 1));
      d.addEventListener('click', () => go(idx));
      dotsWrap.appendChild(d);
    });
    const dots = Array.from(dotsWrap.children);

    function go(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
      dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
      prev.disabled = i === 0;
      next.disabled = i === slides.length - 1;
      counter.textContent = (i + 1) + ' / ' + slides.length;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    prev.addEventListener('click', () => go(i - 1));
    next.addEventListener('click', () => go(i + 1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') go(i + 1);
      if (e.key === 'ArrowLeft') go(i - 1);
    });

    let x0 = null;
    const stage = document.querySelector('.stage');
    stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) go(dx < 0 ? i + 1 : i - 1);
      x0 = null;
    }, { passive: true });

    document.getElementById('year').textContent = new Date().getFullYear();
    setLang(localStorage.getItem('lang') || 'fr');
    go(0);
  </script>
