    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {

      --bleu-clair:  #E08820;
      --vert:        #1E9660;
      --vert-clair:  #28A870;
      --terre:       #D4820A;
      --beige:       #F5F0E8;
      --beige-fort:  #EDE7D9;

      --shadow-lift: 0 16px 34px rgba(13,58,30,0.11);
      --radius-sm:   8px;
      --radius-md:   14px;
      --radius-lg:   18px;
      --text-soft:   rgba(13,58,30,0.74);
      --text-muted:  rgba(13,58,30,0.58);
    }

    body {

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(12, 74, 53, 0.97);
      backdrop-filter: blur(8px);
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }
    .logo img { height: 38px; width: auto; display: block; border-radius: 6px; }
    .logo-name { display: flex; flex-direction: column; line-height: 1.15; font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 0.3px; }
    .logo-sub { font-size: 0.58rem; font-weight: 500; letter-spacing: 0.45em; margin-right: -0.45em; text-transform: uppercase; opacity: 0.72; }

    .nav-right { display: flex; align-items: center; gap: 1.5rem; }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.2rem;
    }
    .nav-links a {
      color: rgba(255,255,255,0.80);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #fff; }
    .nav-links a.active { color: #fff; font-weight: 700; }

    .nav-cta {
      background: var(--terre);
      color: #fff !important;
      padding: 0.45rem 1.1rem;
      border-radius: 6px;
      font-weight: 600 !important;
    }
    .nav-cta:hover { opacity: 0.88; }

    /* ── DROPDOWN ── */
    .dropdown { position: relative; }
    .dropdown-toggle { display: inline-flex; align-items: center; gap: 0.25rem; }
    .dropdown-toggle::after { content: '▾'; font-size: 0.65rem; opacity: 0.65; display: inline-block; transition: transform 0.2s; }
    .dropdown:hover .dropdown-toggle::after { transform: rotate(180deg); }
    .dropdown-menu {
      display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      background: rgba(10,62,44,0.98); backdrop-filter: blur(8px); border-radius: 6px;
      min-width: 210px; padding: 0.7rem 0 0.35rem;
      box-shadow: 0 8px 28px rgba(0,0,0,0.28); list-style: none; z-index: 200;
    }
    .dropdown:hover .dropdown-menu { display: block; }
    .dropdown-menu li a { display: block; padding: 0.55rem 1.2rem; color: rgba(255,255,255,0.82); text-decoration: none; font-size: 0.82rem; font-weight: 500; white-space: nowrap; transition: background 0.15s, color 0.15s; }
    .dropdown-menu li a:hover { background: rgba(255,255,255,0.08); color: #fff; }

    /* ── MOBILE DROPDOWN ── */
    .mobile-dropdown-toggle { display: flex; width: 100%; align-items: center; justify-content: space-between; background: none; border: none; border-bottom: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); font-family: inherit; font-size: 1rem; font-weight: 500; padding: 0.85rem 0; cursor: pointer; text-align: left; }
    .mobile-dropdown-toggle::after { content: '▾'; font-size: 0.7rem; opacity: 0.65; transition: transform 0.2s; flex-shrink: 0; }
    .mobile-dropdown-toggle.open::after { transform: rotate(180deg); }
    .mobile-dropdown-toggle:hover { color: #fff; }
    .mobile-dropdown-menu { display: none; list-style: none; padding: 0; }
    .mobile-dropdown-menu.open { display: block; }
    .mobile-dropdown-menu li a { display: block; color: rgba(255,255,255,0.72); text-decoration: none; font-size: 0.95rem; font-weight: 500; padding: 0.7rem 0 0.7rem 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.06); transition: color 0.2s; }
    .mobile-dropdown-menu li:last-child a { border-bottom: 1px solid rgba(255,255,255,0.1); }
    .mobile-dropdown-menu li a:hover { color: #fff; }

    .lang-switcher { display: flex; gap: 0.3rem; }
    .lang-switcher button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.35);
      color: rgba(255,255,255,0.65);
      padding: 0.28rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .lang-switcher button:hover { border-color: rgba(255,255,255,0.7); color: #fff; }
    .lang-switcher button.active { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.6); color: #fff; }

    /* ── HAMBURGER ── */
    .hamburger {
      display: none;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.2rem 0.3rem;
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      background: rgba(12, 74, 53, 0.97);
      backdrop-filter: blur(8px);
      z-index: 99;
      padding: 0.5rem 1.5rem 1rem;
    }
    .mobile-menu ul { list-style: none; }
    .mobile-menu ul li a { display: block; color: rgba(255,255,255,0.85); text-decoration: none; font-size: 1rem; font-weight: 500; padding: 0.85rem 0; border-bottom: 1px solid rgba(255,255,255,0.1); transition: color 0.2s; }
    .mobile-menu ul li:last-child a { border-bottom: none; }
    .mobile-menu ul li a:hover { color: #fff; }
    .mobile-menu ul li a.nav-cta { display: inline-block; margin-top: 0.6rem; border-bottom: none; background: var(--terre); color: #fff; padding: 0.55rem 1.3rem; border-radius: 6px; font-weight: 600; }
    .mobile-menu.open { display: block; }

    /* ── HERO ── */
    .hero {
      background:
        linear-gradient(160deg, rgba(12,74,53,0.90) 0%, rgba(7,43,31,0.96) 100%),
        url('images/hero-background.jpg') center / cover no-repeat;
      padding: 9rem 2.5rem 4rem;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    .tag-editorial {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.3rem 0.9rem;
      border-radius: 4px;
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      background: rgba(192,104,0,0.18);
      color: var(--bleu-clair);
      border: 1px solid rgba(192,104,0,0.35);
    }
    .tag-editorial::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      background: var(--bleu-clair);
      border-radius: 50%;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
      margin-bottom: 0.75rem;
      max-width: 900px;
    }

    .hero p.subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,0.72);
      max-width: 760px;
      margin-bottom: 1.6rem;
      line-height: 1.8;
    }

    .audience-row { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
    .audience-chip {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      padding: 0.5rem 1rem;
      font-size: 0.86rem;
      font-weight: 600;
      color: #fff;
    }

    .btn-back {
      display: inline-block;
      background: rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.80);
      border: 1px solid rgba(255,255,255,0.22);
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.16); color: #fff; }

    /* ── SECTIONS DE CONTENU ── */
    .cmt-section { padding: 4.5rem 2.5rem; }
    .cmt-section.bg-beige { background: var(--beige); }
    .cmt-section.bg-blanc { background: var(--blanc); }

    .tag {
      display: inline-block; padding: 0.3rem 0.9rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem;
    }
    .tag-vert  { background: rgba(30,150,96,0.13); color: var(--vert); border: 1px solid rgba(30,150,96,0.18); }
    .tag-orange{ background: rgba(192,104,0,0.13); color: var(--orange); border: 1px solid rgba(192,104,0,0.18); }
    .tag-terre { background: rgba(212,130,10,0.14); color: var(--terre); border: 1px solid rgba(212,130,10,0.18); }

    .cmt-section h2 { font-size: clamp(1.5rem, 3.2vw, 2.1rem); font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; color: var(--orange); margin-bottom: 0.7rem; }
    .cmt-section .lead { font-size: clamp(1rem, 1.5vw, 1.1rem); color: var(--text-soft); line-height: 1.8; max-width: 820px; }

    .steps { display: grid; gap: 0.9rem; margin-top: 1.8rem; grid-template-columns: repeat(2, 1fr); }
    .step {
      display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start;
      background: var(--blanc); border: 1px solid var(--line-soft); border-radius: var(--radius-md);
      padding: 1.2rem 1.4rem; box-shadow: var(--shadow-soft);
    }
    .cmt-section.bg-blanc .step { background: var(--beige); }
    .step-num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.95rem; color: #fff; background: var(--vert); }
    .cmt-soutien .step-num { background: var(--orange); }
    .step h3 { font-size: 1.02rem; font-weight: 700; margin-bottom: 0.2rem; }
    .step p { font-size: 0.92rem; color: var(--text-soft); line-height: 1.6; }
    .hl { color: var(--orange); font-weight: 700; }
    .hlv { color: var(--vert); font-weight: 700; }

    .duree-row { display: flex; gap: 0.6rem; margin-top: 0.6rem; flex-wrap: wrap; }
    .duree { font-size: 0.82rem; font-weight: 700; color: var(--vert); background: rgba(30,150,96,0.10); border: 1px solid rgba(30,150,96,0.22); border-radius: 999px; padding: 0.25rem 0.8rem; }

    .note { margin-top: 1.6rem; font-size: 0.9rem; color: var(--text-soft); background: rgba(212,130,10,0.09); border-left: 3px solid var(--terre); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 1rem 1.2rem; max-width: 900px; }

    /* ── SCHÉMA DE MISE EN RELATION ── */
    .flow { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: stretch; margin-top: 2rem; }
    .flow-col { display: grid; gap: 0.8rem; align-content: start; }
    .flow-head { text-align: center; font-weight: 800; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; padding: 0.6rem; border-radius: var(--radius-sm); }
    .flow-head.terrain { color: var(--vert); background: rgba(30,150,96,0.12); }
    .flow-head.soutien { color: var(--orange); background: rgba(192,104,0,0.12); }
    .flow-box { background: var(--blanc); border: 1px solid var(--line-soft); border-radius: var(--radius-md); padding: 0.9rem 1.1rem; box-shadow: var(--shadow-soft); font-size: 0.86rem; }
    .flow-box b { display: block; font-size: 0.85rem; margin-bottom: 0.2rem; }
    .flow-box.terrain b { color: var(--vert); }
    .flow-box.soutien b { color: var(--orange); }
    .flow-box p { color: var(--text-soft); font-size: 0.83rem; line-height: 1.5; }
    .flow-mid { display: grid; place-items: center; }
    .flow-hub { writing-mode: vertical-rl; text-orientation: mixed; background: linear-gradient(180deg, var(--vert), var(--orange)); color: #fff; font-weight: 800; font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 1.2rem 0.7rem; border-radius: var(--radius-md); box-shadow: var(--shadow-soft); display: grid; place-items: center; height: 100%; }
    .flow-note { text-align: center; margin-top: 1.6rem; font-size: 0.92rem; color: var(--text-soft); max-width: 760px; margin-left: auto; margin-right: auto; }

    /* ── CTA FINAL ── */
    .cmt-cta {
      background: linear-gradient(160deg, rgba(12,74,53,0.96) 0%, rgba(7,43,31,0.98) 100%);
      text-align: center;
    }
    .cmt-cta .tag-light { display: inline-block; padding: 0.3rem 0.9rem; border-radius: 999px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem; background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); }
    .cmt-cta h2 { color: #fff; font-size: clamp(1.6rem, 3.4vw, 2.3rem); font-weight: 800; margin-bottom: 0.6rem; }
    .cmt-cta .lead { color: rgba(255,255,255,0.75); max-width: 640px; margin: 0 auto 2rem; font-size: 1.02rem; line-height: 1.8; }
    .cta-btns { display: flex; gap: 0.9rem; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; padding: 0.85rem 1.7rem; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.96rem; transition: all 0.2s; }
    .btn-principal { background: var(--orange); color: #fff; }
    .btn-principal:hover { background: var(--orange-fort); }
    .btn-contour { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.5); }
    .btn-contour:hover { border-color: #fff; background: rgba(255,255,255,0.10); }

    /* ── FOOTER ── */
    footer {
      background: #083828;
      color: rgba(255,255,255,0.45);
      text-align: center;
      padding: 2rem;
      font-size: 0.85rem;
    }
    .footer-legal      { margin-top: .5rem; }
    .footer-legal a    { font-size: .78rem; opacity: .6; color: inherit; text-decoration: none; }
    .footer-legal a:hover { opacity: 1; text-decoration: underline; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .steps { grid-template-columns: 1fr; }
      .flow { grid-template-columns: 1fr; }
      .flow-mid { display: none; }
      .flow-hub { writing-mode: horizontal-tb; height: auto; padding: 0.7rem; }
    }
    @media (max-width: 700px) {
      nav { padding: 0.8rem 1.2rem; }
      .nav-links { gap: 0.8rem; font-size: 0.8rem; }
      .hero { padding: 8rem 1.4rem 3rem; }
      .cmt-section { padding: 3rem 1.4rem; }
    }
    @media (max-width: 540px) {
      .nav-links { display: none; }
      .hamburger { display: block; }
    }
  </style>
</head>

  <script>
    function toggleMobileMenu() {
      document.getElementById('mobile-menu').classList.toggle('open');
    }
    function closeMobileMenu() {
      document.getElementById('mobile-menu').classList.remove('open');
      document.querySelectorAll('.mobile-dropdown-toggle.open').forEach(function(b) {
        b.classList.remove('open');
        b.nextElementSibling.classList.remove('open');
      });
    }
    function toggleMobileDropdown(btn) {
      btn.classList.toggle('open');
      btn.nextElementSibling.classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      var menu = document.getElementById('mobile-menu');
      var btn  = document.getElementById('hamburger-btn');
      if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) {
        menu.classList.remove('open');
      }
    });
